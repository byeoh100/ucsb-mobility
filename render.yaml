# Render Blueprint: the web app plus a Postgres database.
# In Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: cart-dispatch
    runtime: docker
    plan: free          # free instances sleep when idle; use a paid plan for real shifts
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cart-dispatch-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TIME_ZONE
        value: America/Los_Angeles
      # Render asks for these when you create the Blueprint.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      # Your developer login for /django-admin/ (separate from Google sign-in).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: cart-dispatch-db
    plan: free
